<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Redirecting…</title>
    <script>
      // SPA fallback: redirect 404s to index.html preserving the path
      sessionStorage.redirect = location.href;
      location.replace(location.pathname.split("/").slice(0, 2).join("/") + "/");
    </script>
  </head>
  <body></body>
</html>
